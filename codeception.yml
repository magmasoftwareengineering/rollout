actor: Tester
paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
  envs: tests/_envs

settings:
  colors: true
  strict: true
  reruns: 0

extensions:
  enabled:
    - Codeception\Extension\RunFailed

coverage:
  enabled: true
  include:
    - src
  exclude:
    - tests
  reports:
    html: null
    xml: null

suites:
  Unit:
    actor: UnitTester
    path: Unit
    modules:
      enabled:
        - Asserts
